<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Nest</title>
<meta name="description" content="A 90-second vertical (4:5) animation of The Nest, a conceptual renovation of Lincoln Financial Field: the stadium today, the lowered field and new rows, the canopy, acoustics, north and south video boards, new experiences, lighting and technology.">
<style>
  :root{
    --white:#FFFFFF; --light:#ECF0EF; --mid:#A5ACAF; --graphite:#1C282C; --blue:#004C54; --cyan:#2FAE4E;
    --font:"Helvetica Neue","HelveticaNeue",Helvetica,Inter,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--white);color:var(--graphite);font-family:var(--font);font-weight:300;min-height:100%}
  body{display:flex;flex-direction:column;min-height:100vh}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 8px}
  .frame{position:relative;width:min(100%, calc((100vh - 150px) * 4 / 5));aspect-ratio:4/5;background:var(--white);
    box-shadow:0 0 0 1px var(--light), 0 40px 90px -50px rgba(58,64,72,.35)}
  canvas{display:block;width:100%;height:100%}
  .start{position:absolute;inset:0;border:0;background:rgba(255,255,255,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:6% 6.25%;cursor:pointer;text-align:left;font-family:var(--font);color:var(--graphite)}
  .start .k{font-weight:700;font-size:clamp(11px,1vw,15px);letter-spacing:.28em;text-transform:uppercase}
  .start .t{font-weight:700;font-size:clamp(28px,5vw,76px);letter-spacing:-.02em;margin:.25em 0 .2em;line-height:1}
  .start .s{font-weight:300;font-size:clamp(12px,1.2vw,18px);color:var(--mid)}
  .start .p{margin-top:1.4em;display:inline-flex;align-items:center;gap:.7em;font-weight:300;font-size:clamp(12px,1.1vw,16px);letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
  .start .p i{display:inline-block;width:0;height:0;border-left:11px solid var(--blue);border-top:7px solid transparent;border-bottom:7px solid transparent}
  .start.hidden{display:none}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px 6px;width:min(100%, calc((100vh - 150px) * 4 / 5 + 32px));margin:0 auto}
  .bar button{font-family:var(--font);font-weight:300;font-size:12px;letter-spacing:.16em;text-transform:uppercase;background:none;border:0;color:var(--graphite);cursor:pointer;padding:6px 0}
  .bar button:hover,.bar button.on{color:var(--blue)}
  .scrub{position:relative;flex:1 1 260px;height:28px;display:flex;align-items:center}
  .scrub input{width:100%;appearance:none;-webkit-appearance:none;background:transparent;height:28px;position:relative;z-index:2;cursor:pointer}
  .scrub input::-webkit-slider-runnable-track{height:1px;background:var(--mid)}
  .scrub input::-moz-range-track{height:1px;background:var(--mid)}
  .scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--blue);margin-top:-5px;border:0}
  .scrub input::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--blue);border:0}
  .ticks{position:absolute;left:0;right:0;top:50%;height:0;z-index:1;pointer-events:none}
  .ticks span{position:absolute;top:-5px;width:1px;height:10px;background:var(--mid)}
  .tc{font-size:12px;letter-spacing:.14em;color:var(--mid);font-variant-numeric:tabular-nums;min-width:110px}
  .chapters{display:flex;flex-wrap:wrap;gap:4px 18px;padding:0 16px 22px;width:min(100%, calc((100vh - 150px) * 4 / 5 + 32px));margin:0 auto}
  .chapters button{font-family:var(--font);font-weight:300;font-size:12px;letter-spacing:.04em;color:var(--mid);background:none;border:0;cursor:pointer;padding:2px 0}
  .chapters button b{font-weight:700;color:var(--graphite);margin-right:6px}
  .chapters button.on{color:var(--blue)} .chapters button.on b{color:var(--blue)}
  body.export .bar, body.export .chapters, body.export .start{display:none}
  body.export .stage{padding:0} body.export .frame{width:1080px;height:1350px;box-shadow:none}
  @media (max-width:640px){ body{min-height:0} .stage{flex:none;padding:16px 16px 4px} .bar,.chapters{width:100%} }
</style>
</head>
<body>
<main class="stage">
  <div class="frame" id="frame">
    <canvas id="cv" width="1080" height="1350" aria-label="Anatomy of the Game animation"></canvas>
    <button class="start" id="start" type="button">
      <span class="k">A proposal · Lincoln Financial Field</span>
      <span class="t">The Nest</span>
      <span class="s">90 seconds · best with sound</span>
      <span class="p"><i></i>Play film</span>
    </button>
  </div>
</main>
<div class="bar">
  <button id="pp" type="button">Play</button>
  <div class="scrub"><div class="ticks" id="ticks"></div><input id="sc" type="range" min="0" max="90" step="0.01" value="0" aria-label="Timeline"></div>
  <span class="tc" id="tc">00:00 / 01:30</span>
  <button id="snd" type="button" class="on">Sound on</button>
  <button id="rec" type="button">Export WebM</button>
  <button id="fs" type="button">Fullscreen</button>
</div>
<nav class="chapters" id="chapters"></nav>

<script>
"use strict";
/* =====================================================================
   ANATOMY OF THE GAME · VOL. II, AMERICAN FOOTBALL — 90 s procedural animation
   Every frame is a pure function of time t (seconds), so the film can be
   played, scrubbed, or rendered frame-by-frame to video.
   ===================================================================== */
const W = 1080, H = 1350, DUR = 90, TAU = Math.PI * 2, BEAT = 60 / 70;
const RGB = { white:[255,255,255], light:[236,240,239], mid:[165,172,175], graphite:[28,40,44], blue:[0,76,84], cyan:[47,174,78] };
const rgba = (k, a) => `rgba(${RGB[k][0]},${RGB[k][1]},${RGB[k][2]},${Math.max(0, Math.min(1, a))})`;
const FONT = '"Helvetica Neue","HelveticaNeue",Helvetica,Inter,Arial,sans-serif';

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smooth = t => t * t * (3 - 2 * t);
const env = (t, a, b, c, d) => Math.min(smooth(seg(t, a, b)), 1 - smooth(seg(t, c, d)));
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const fmt = (v, d = 0) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

/* heartbeat: lub-dub on a 70 bpm grid */
const gpulse = x => x < 0 ? 0 : (1 - Math.exp(-x * 45)) * Math.exp(-x * 8.5);
function heartPulse(t, start, end) {
  if (t < start || t > end + .8) return 0;
  const n = Math.floor((t - start) / BEAT); let v = 0;
  for (let k = n - 1; k <= n; k++) { if (k < 0) continue; const bt = start + k * BEAT; if (bt > end) continue; v += gpulse(t - bt) + .55 * gpulse(t - bt - .24); }
  return v / .6;
}
const G = (l, m, s) => Math.exp(-(((l - m) / s) ** 2));
function ecg(tt, start) {
  if (tt < start) return 0;
  const l = ((tt - start + .1) % BEAT) - .1;
  return -.12 * G(l, -.012, .008) + G(l, .012, .011) - .28 * G(l, .036, .011) + .2 * G(l, .26, .05) + .07 * G(l, BEAT - .2, .03);
}

/* ---------- camera ---------- */
function cam(o) {
  const cy = Math.cos(o.yaw), sy = Math.sin(o.yaw), cp = Math.cos(o.pitch), sp = Math.sin(o.pitch);
  return { o, p(x, y, z) {
    x -= o.tx; y -= o.ty; z -= o.tz;
    const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
    const y2 = y * cp + z1 * sp, z2 = -y * sp + z1 * cp;
    const d = Math.max(.01, o.dist + z2), s = o.f / d;
    return [o.cx + x1 * s, o.cy - y2 * s, d, s];
  } };
}
function camKeys(keys, t) {
  if (t <= keys[0].t) return Object.assign({}, keys[0]);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b.t) { const k = ease((t - a.t) / (b.t - a.t)); const o = {}; for (const key in a) o[key] = lerp(a[key], b[key], k); return o; }
  }
  return Object.assign({}, keys[keys.length - 1]);
}
const proj = (c, pts) => pts.map(q => c.p(q[0], q[1], q[2]));

/* ---------- drawing primitives ---------- */
function polyPartial(c, p2, p) {
  const n = p2.length - 1; if (n < 1 || p <= 0) return;
  const f = clamp(p) * n, k = Math.floor(f);
  c.moveTo(p2[0][0], p2[0][1]);
  for (let i = 1; i <= Math.min(k, n); i++) c.lineTo(p2[i][0], p2[i][1]);
  if (k < n) { const a = p2[k], b = p2[k + 1], r = f - k; c.lineTo(a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r); }
}
function polyLen(c, pts, p) {
  let L = 0; const ls = []; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); ls.push(l); L += l; }
  let rem = clamp(p) * L; c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (rem >= ls[i - 1]) { c.lineTo(pts[i][0], pts[i][1]); rem -= ls[i - 1]; }
    else { const r = ls[i - 1] ? rem / ls[i - 1] : 0; c.lineTo(lerp(pts[i - 1][0], pts[i][0], r), lerp(pts[i - 1][1], pts[i][1], r)); break; }
  }
}
function strokeDepth(c, pr, dRef, fs, fw, bs, bw) {
  c.beginPath();
  for (let i = 1; i < pr.length; i++) if ((pr[i][2] + pr[i - 1][2]) / 2 > dRef) { c.moveTo(pr[i - 1][0], pr[i - 1][1]); c.lineTo(pr[i][0], pr[i][1]); }
  c.strokeStyle = bs; c.lineWidth = bw; c.stroke();
  c.beginPath();
  for (let i = 1; i < pr.length; i++) if ((pr[i][2] + pr[i - 1][2]) / 2 <= dRef) { c.moveTo(pr[i - 1][0], pr[i - 1][1]); c.lineTo(pr[i][0], pr[i][1]); }
  c.strokeStyle = fs; c.lineWidth = fw; c.stroke();
}
function taper(c, A, ra, B, rb) {
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1e-6, nx = -dy / L, ny = dx / L;
  c.moveTo(A[0] + nx * ra, A[1] + ny * ra); c.lineTo(B[0] + nx * rb, B[1] + ny * rb); c.lineTo(B[0] - nx * rb, B[1] - ny * rb); c.lineTo(A[0] - nx * ra, A[1] - ny * ra); c.closePath();
  c.moveTo(A[0] + ra, A[1]); c.arc(A[0], A[1], ra, 0, TAU); c.moveTo(B[0] + rb, B[1]); c.arc(B[0], B[1], rb, 0, TAU);
}
function spindle(c, A, B, w, t0, t1, off) {
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const sx = A[0] + dx * t0 + nx * off, sy = A[1] + dy * t0 + ny * off, ex = A[0] + dx * t1 + nx * off, ey = A[1] + dy * t1 + ny * off;
  const mx = (sx + ex) / 2, my = (sy + ey) / 2;
  c.moveTo(sx, sy); c.quadraticCurveTo(mx + nx * w * 2, my + ny * w * 2, ex, ey); c.quadraticCurveTo(mx - nx * w * 2, my - ny * w * 2, sx, sy);
  for (const f of [.42, -.42]) { c.moveTo(sx, sy); c.quadraticCurveTo(mx + nx * w * 2 * f, my + ny * w * 2 * f, ex, ey); }
}
function bone(c, A, B, w) {
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  for (const s of [1, -1]) { c.moveTo(A[0] + dx * .1 + nx * w * s, A[1] + dy * .1 + ny * w * s); c.lineTo(A[0] + dx * .9 + nx * w * .8 * s, A[1] + dy * .9 + ny * w * .8 * s); }
  c.moveTo(A[0] + dx * .06 + w * 1.7, A[1] + dy * .06); c.arc(A[0] + dx * .06, A[1] + dy * .06, w * 1.7, 0, TAU);
  c.moveTo(A[0] + dx * .94 + w * 1.4, A[1] + dy * .94); c.arc(A[0] + dx * .94, A[1] + dy * .94, w * 1.4, 0, TAU);
}

/* ---------- typography ---------- */
function txt(c, s, x, y, o = {}) {
  const { w = 300, size = 20, color = 'graphite', a = 1, ls = 0, align = 'left' } = o;
  if (!s || a <= 0) return;
  c.font = `${w} ${size}px ${FONT}`; c.fillStyle = rgba(color, a); c.textAlign = align; c.textBaseline = 'alphabetic';
  c.letterSpacing = ls + 'px'; c.fillText(s, x, y); c.letterSpacing = '0px';
}
const typed = (s, p) => s.slice(0, Math.floor(s.length * clamp(p) + 1e-6));
function headline(c, segs, x, y, p, o = {}) {
  const { size = 48, w = 700, maxW = 1200, lh = 1.16, a = 1 } = o;
  if (p <= 0 || a <= 0) return;
  c.font = `${w} ${size}px ${FONT}`; c.letterSpacing = (size >= 40 ? -size * .018 : 0) + 'px';
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  const toks = []; for (const [s, col] of segs) s.split(/(\s+)/).forEach(tk => { if (tk) toks.push([tk, col, c.measureText(tk).width]); });
  const lines = [[]]; let lw = 0;
  for (const tk of toks) {
    const sp = /^\s+$/.test(tk[0]);
    if (!sp && lw + tk[2] > maxW && lw > 0) { lines.push([]); lw = 0; }
    if (sp && lw === 0) continue;
    lines[lines.length - 1].push(tk); lw += tk[2];
  }
  let total = 0; for (const L of lines) for (const tk of L) total += tk[0].length;
  let rem = Math.floor(total * clamp(p) + 1e-6), cx = x, cy = y;
  for (let li = 0; li < lines.length && rem > 0; li++) {
    cx = x; cy = y + li * size * lh;
    for (const tk of lines[li]) {
      if (rem <= 0) break;
      const s = tk[0].slice(0, rem); c.fillStyle = rgba(tk[1], a); c.fillText(s, cx, cy);
      cx += s.length === tk[0].length ? tk[2] : c.measureText(s).width; rem -= tk[0].length;
    }
  }
  if (p < 1) { c.fillStyle = rgba('blue', a); c.fillRect(cx + 4, cy - size * .74, Math.max(2, size * .05), size * .86); }
  c.letterSpacing = '0px';
}
function leader(c, ax, ay, tx, ty, p, title, sub, o = {}) {
  const { a = 1, tsize = 22 } = o;
  if (p <= 0 || a <= 0) return;
  c.font = `700 ${tsize}px ${FONT}`; const w1 = c.measureText(title).width;
  c.font = `300 16px ${FONT}`; const w2 = sub ? c.measureText(sub).width : 0;
  const right = tx > ax, ex = right ? tx - 16 : tx + Math.max(w1, w2) + 16, ly = ty - tsize * .34;
  const dir = Math.sign(ex - ax) || 1, kx = ax + dir * Math.min(Math.abs(ly - ay), Math.abs(ex - ax) * .6);
  const lp = easeOut(seg(p, 0, .5));
  c.fillStyle = rgba('blue', a); c.beginPath(); c.arc(ax, ay, 3.2, 0, TAU); c.fill();
  c.strokeStyle = rgba('blue', .35 * a); c.lineWidth = 1; c.beginPath(); c.arc(ax, ay, 8 * easeOut(seg(p, 0, .3)), 0, TAU); c.stroke();
  c.strokeStyle = rgba('mid', a); c.beginPath(); polyLen(c, [[ax, ay], [kx, ly], [ex, ly]], lp); c.stroke();
  if (lp >= 1) { c.fillStyle = rgba('graphite', a); c.fillRect(ex - (right ? 0 : 1), ly - 3, 1, 6); }
  txt(c, typed(title, seg(p, .35, .75)), tx, ty, { w: 700, size: tsize, color: 'graphite', a });
  if (sub) txt(c, typed(sub, seg(p, .5, 1)), tx, ty + 25, { size: 16, color: 'mid', a });
}
function kicker(c, s, x, y, p, a = 1, color = 'mid') { txt(c, typed(s, p), x, y, { size: 14, ls: 3, color, a }); }
function marker(c, x, y, a, s = 9) {
  c.strokeStyle = rgba('blue', a); c.lineWidth = 1.2; c.strokeRect(x - s / 2, y - s / 2, s, s);
  c.beginPath(); c.moveTo(x - s, y); c.lineTo(x - s / 2 - 2, y); c.moveTo(x + s / 2 + 2, y); c.lineTo(x + s, y);
  c.moveTo(x, y - s); c.lineTo(x, y - s / 2 - 2); c.moveTo(x, y + s / 2 + 2); c.lineTo(x, y + s); c.stroke();
}
function glowStroke(c, color, a, w, blur) {
  c.save(); c.shadowColor = rgba(color, a); c.shadowBlur = blur * SC; c.strokeStyle = rgba(color, a); c.lineWidth = w; c.stroke(); c.restore();
}

/* =====================================================================
   SHARED GEOMETRY
   ===================================================================== */
/* superellipse plan used by every stadium view */
const NS = 96, OVC = new Map();
function ovPt(a, b, th, n = 2.8) { const cc = Math.cos(th), s = Math.sin(th); return [a * Math.sign(cc) * Math.pow(Math.abs(cc), 2 / n), b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]; }
function oval(a, b) { const k = a + '_' + b; if (!OVC.has(k)) { const p = []; for (let i = 0; i <= NS; i++) p.push(ovPt(a, b, i / NS * TAU)); OVC.set(k, p); } return OVC.get(k); }
const ring3 = (a, b, y) => oval(a, b).map(q => [q[0], y, q[1]]);
const ringP = (cm, a, b, y) => oval(a, b).map(q => cm.p(q[0], y, q[1]));

/* American football field (metres; x along the field, z across, y up) */
const YD = .9144, FX = 54.864, FZ = 24.384, GL = 45.72, yx = y => -GL + y * YD;  // yx: yard line (0 = left goal line) -> x
const PL = (() => {
  const L = [], y = 0;
  L.push([[-FX, y, -FZ], [FX, y, -FZ], [FX, y, FZ], [-FX, y, FZ], [-FX, y, -FZ]]);
  for (let i = 0; i <= 20; i++) { const x = yx(i * 5); L.push([[x, y, -FZ], [x, y, FZ]]); }
  return L;
})();
const HASH = (() => { const s = []; for (let i = 1; i < 100; i++) { if (i % 5 === 0) continue; for (const z of [-FZ + .35, -2.82, 2.82, FZ - .35]) s.push([yx(i), z]); } return s; })();
function drawField(c, cm, o = {}) {
  const { a = 1, lines = 1, hashA = 1, posts = 1, surf = 1, dx = 0, lift = 0 } = o;
  if (a <= 0) return;
  const P = (x, y, z) => cm.p(x + dx, y + lift, z);
  const quad = pts => { c.beginPath(); pts.forEach((q, i) => { const p = P(q[0], 0, q[1]); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }); c.closePath(); };
  if (surf > 0) {
    quad([[-FX, -FZ], [FX, -FZ], [FX, FZ], [-FX, FZ]]); c.fillStyle = rgba('white', .88 * surf * a); c.fill();
    for (let i = 0; i < 20; i += 2) { const x0 = yx(i * 5), x1 = yx(i * 5 + 5); quad([[x0, -FZ], [x1, -FZ], [x1, FZ], [x0, FZ]]); c.fillStyle = rgba('light', .65 * surf * a); c.fill(); }
    for (const s of [-1, 1]) { quad([[s * GL, -FZ], [s * FX, -FZ], [s * FX, FZ], [s * GL, FZ]]); c.fillStyle = rgba('cyan', .16 * surf * a); c.fill(); }
  }
  if (lines) drawPitchLines(c, { p: P, o: cm.o }, a, lines);
  if (hashA > 0) { c.beginPath(); for (const [x, z] of HASH) { const p = P(x, 0, z - .3), q = P(x, 0, z + .3); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); } c.strokeStyle = rgba('graphite', .45 * hashA * a); c.lineWidth = 1; c.stroke(); }
  if (posts > 0) {
    c.beginPath();
    for (const s of [-1, 1]) {
      const x = s * (FX + 1.2), top = 3.05 + 10.67 * posts;
      for (const [A, B] of [[[x, 0, 0], [x, 3.05, 0]], [[x, 3.05, -2.82], [x, 3.05, 2.82]], [[x, 3.05, -2.82], [x, top, -2.82]], [[x, 3.05, 2.82], [x, top, 2.82]]]) { const p = P(...A), q = P(...B); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); }
    }
    c.strokeStyle = rgba('blue', .9 * a); c.lineWidth = 1.6; c.stroke();
  }
}

function drawPitchLines(c, cm, a, prog = 1, t0 = 0) {
  c.lineWidth = 1.2;

  $('snd').onclick = () => { const was = playing; if (was) pause(); soundOn = !soundOn; if (was) play(); ui(); };

  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.code !== 'Space') return; if (e.code === 'Space') { e.preventDefault(); $('start').classList.add('hidden'); playing ? pause() : play(); } if (e.code === 'ArrowRight') seek(curT() + 2); if (e.code === 'ArrowLeft') seek(curT() - 2); });
  $('rec').onclick = () => {
    if (recorder) return;
    if (!window.MediaRecorder || !cv.captureStream) { alert('Recording is not supported in this browser.'); return; }
    $('start').classList.add('hidden'); pause(); soundOn = true; ensureAC();
    forceFull = true; resize();
    recDest = ac.createMediaStreamDestination(); recBus.connect(recDest);
    const stream = new MediaStream([...cv.captureStream(60).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
    const type = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 }); const chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'the-nest.webm'; a.click(); recBus.disconnect(recDest); recorder = null; forceFull = false; resize(); $('rec').textContent = 'Export WebM'; $('rec').classList.remove('on'); };
    recorder.start(250); $('rec').textContent = 'Recording…'; $('rec').classList.add('on');
    tHold = 0; play();
  };
  ui(); requestAnimationFrame(loop);
}
</script>
