<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seating Bowl — Lincoln Financial Field</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #F4F5F2; }
    #frame > * { position: absolute; left: 0; top: 0; }
    #overlay { width: 1920px; height: 1080px; pointer-events: none; }
    #grain { width: 1920px; height: 1080px; pointer-events: none; mix-blend-mode: multiply; opacity: 0.07; background-size: 512px 512px; }
    #cover { width: 1920px; height: 1080px; pointer-events: none; background: #F4F5F2; opacity: 0; }
    #qa { width: 1920px; height: 1080px; pointer-events: none; opacity: 0.5; display: none; }
    #hud { position: fixed; right: 12px; bottom: 10px; font: 12px/1.3 system-ui, sans-serif; color: #9aa; opacity: 0.0; transition: opacity .3s; }
    body:hover #hud { opacity: 0.8; }
    body.record #hud { display: none; }
  </style>
</head>
<body>
  <div id="frame">
    <div id="gl"></div>
    <svg id="overlay" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="grain"></div>
    <div id="cover"></div>
    <img id="qa" alt="" />
  </div>
  <div id="hud">Space pause · ←/→ scene · R restart</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
